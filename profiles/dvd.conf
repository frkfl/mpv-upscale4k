[dvd]
# Applied by scripts/dvd_profile.lua — never auto-triggered
glsl-shaders-clr

# Mpv native cleanup
## DVD improvement
vf=bwdif,scale=in_chroma_loc=left,pp=hb/vb/dr,lavfi=[spp],lavfi=[hqdn3d=1.2:1.2:2.0:2.0]
## deband
deband=yes
deband-iterations=5
deband-grain=40
## antiring
scale-antiring=1.0
cscale-antiring=1.0
dscale-antiring=1.0

## DVD MPEG-2 DCT block deblock
glsl-shaders-append="~~/shaders/dvd_luma_deblock.glsl"
glsl-shader-opts-append=dcld_strength=0.30
glsl-shader-opts-append=dcld_threshold=0.06
glsl-shaders-append="~~/shaders/dvd_chroma_deblock.glsl"
glsl-shader-opts-append=dccd_strength=0.40
glsl-shader-opts-append=dccd_threshold=0.08
glsl-shader-opts-append=dccd_luma_gate=0.04
## Mosquito noise (DCT ringing near hard edges)
glsl-shaders-append="~~/shaders/mosquito_quench.glsl"
glsl-shader-opts-append=mnq_strength=0.60
glsl-shader-opts-append=mnq_edge_lo=0.04
glsl-shader-opts-append=mnq_edge_hi=0.18
glsl-shader-opts-append=mnq_flicker_lo=0.006
glsl-shader-opts-append=mnq_flicker_hi=0.040
glsl-shader-opts-append=mnq_motion_thr=0.030
## Chroma from Luma
glsl-shaders-append="~~/shaders-dl/CfL_Prediction_RT.glsl"

# Softening
glsl-shaders-append="~~/shaders/nlmeans_parameter.glsl"
glsl-shader-opts-append=nl_strength=0.1

# Block staircase repair — grid-aligned cold-start DCT edges, pre-upscale
glsl-shaders-append="~~/shaders/block_staircase_repair.glsl"
glsl-shader-opts-append=bsr_strength=1.0
glsl-shader-opts-append=bsr_grad_thr=0.01
glsl-shader-opts-append=bsr_temporal_boost=0.6

# Color restoration
## OkLab (Björn Ottosson) BT.601/709 → BT.2020 normalizer
glsl-shaders-append="~~/shaders/autocolormatrix.glsl"
## Full range improvement
glsl-shaders-append="~~/shaders/fullrange_improve.glsl"
glsl-shader-opts-append=fri_strength=0.90
glsl-shader-opts-append=fri_gamma_low=0.80
glsl-shader-opts-append=fri_gamma_high=1.26
glsl-shader-opts-append=fri_chroma_preserve=0.15
glsl-shader-opts-append=fri_pivot=0.45
glsl-shader-opts-append=fri_fade_start=0.80
## HDR-safe OkLCH vibrance
glsl-shaders-append="~~/shaders/oklch_vibrance.glsl"
glsl-shader-opts-append=ov_vibrance=0.30
glsl-shader-opts-append=ov_skin_protect=0.05
glsl-shader-opts-append=ov_skin_hue=0.10
glsl-shader-opts-append=ov_skin_width=0.08
glsl-shader-opts-append=ov_mid_bias=0.42
glsl-shader-opts-append=ov_gamma_in=1.0
glsl-shader-opts-append=ov_gamma_out=1.0
glsl-shader-opts-append=ov_chroma_tame=0.10
## Lighten up the slightly exaggerated vibrance to flatten colors
glsl-shaders-append="~~/shaders/luma_brightness.glsl"
glsl-shader-opts-append=lb_strength=5
glsl-shader-opts-append=lb_shoulder=1.0

# Cleaning of analog issues
## Structural Cleaning Reinforcement Pass
glsl-shaders-append="~~/shaders/analog_structure_cleaner.glsl"
glsl-shader-opts-append=asc_sigma=0.3
glsl-shader-opts-append=asc_m_lo=0.02
glsl-shader-opts-append=asc_m_hi=0.20
glsl-shader-opts-append=asc_r_low=0.15
glsl-shader-opts-append=asc_r_high=0.45
glsl-shader-opts-append=asc_clean=0.3
glsl-shader-opts-append=asc_sharpen=0.6
glsl-shader-opts-append=asc_edge_lo=0.01
glsl-shader-opts-append=asc_edge_hi=0.08
## Edge Stabilization
glsl-shaders-append="~~/shaders/edge_phase_realign_v2.glsl"
glsl-shader-opts-append=eprv_strength=0.5
glsl-shader-opts-append=eprv_edge_gain=4.0
glsl-shader-opts-append=eprv_edge_exp=3.0
glsl-shader-opts-append=eprv_phase_max=0.8
glsl-shader-opts-append=eprv_amp_norm=0.5
glsl-shader-opts-append=eprv_tangential_smooth=0.5
glsl-shader-opts-append=eprv_temporal_alpha=0.3
glsl-shader-opts-append=eprv_global_gain=3.0
glsl-shader-opts-append=eprv_skin_protect=0.0

# Cleaning of digital issues
## A not very fancy hdeband for hi8 8x8 macro blocks
glsl-shaders-append="~~/shaders/hi8_deblock.glsl"
glsl-shader-opts-append=hd_strength=0.50
glsl-shader-opts-append=hd_var_low=0.0003
glsl-shader-opts-append=hd_var_high=0.004
glsl-shader-opts-append=hd_edge_thresh=0.05
glsl-shader-opts-append=hd_debug_mask=0.0
## Mild clean and blockFix again
glsl-shaders-append="~~/shaders/mild_clean_blockfix.glsl"
glsl-shader-opts-append=mcb_clean_strength=0.5
## Geometrical shapes attenuation
glsl-shaders-append="~~/shaders/fake_micro_texture_removal.glsl"
glsl-shader-opts-append=fmtr_clean=0.30
## Quality Deband
glsl-shaders-append="~~/shaders-dl/hdeband.glsl"
## Gentle texturing
glsl-shaders-append="~~/shaders/texture_classify.glsl"
glsl-shader-opts-append=tc_strength=0.5

# Upscale to 4K
glsl-shaders-append="~~/shaders-dl/ravu-r4.hook"

# Cleaning the upscale
## Anti-ringing mop-up
glsl-shaders-append="~~/shaders/ringing_guard.glsl"
glsl-shader-opts-append=rg_strength=0.50
glsl-shader-opts-append=rg_radius=1.5
glsl-shader-opts-append=rg_gamma_in=1.0
glsl-shader-opts-append=rg_gamma_out=1.0
glsl-shader-opts-append=rg_lobe_strength=0.65
glsl-shader-opts-append=rg_lobe_threshold=0.015
glsl-shader-opts-append=rg_lobe_priority=0.65
glsl-shader-opts-append=rg_delta_cap=0.50
glsl-shader-opts-append=rg_apply_threshold=0.02
## Smoothing border
glsl-shaders-append="~~/shaders/micro_diffusion.glsl"
glsl-shader-opts-append=md_strength=0.5
glsl-shader-opts-append=md_low=0.015
glsl-shader-opts-append=md_high=0.04
glsl-shader-opts-append=md_radius=1.2

# Analog feel
## Mattias Gustavsson CRT adaptation
glsl-shaders-append="~~/shaders/crt-mattias.glsl"
glsl-shader-opts-append=cm_bloom_spread=1.6
glsl-shader-opts-append=cm_barrel=0.04
glsl-shader-opts-append=cm_chroma=0.20
glsl-shader-opts-append=cm_halation=0.04
glsl-shader-opts-append=cm_halation_lo=0.70
glsl-shader-opts-append=cm_halation_hi=0.82
glsl-shader-opts-append=cm_contrast=0.01
glsl-shader-opts-append=cm_vignette=0.18
glsl-shader-opts-append=cm_noise=0.010
glsl-shader-opts-append=cm_noise_lo=0.70
glsl-shader-opts-append=cm_noise_hi=0.80
glsl-shader-opts-append=cm_black_lift=0.00
glsl-shader-opts-append=cm_brightness=1.0
## White restoration
glsl-shaders-append="~~/shaders/white_restore_rgb.glsl"
glsl-shader-opts-append=wrr_strength=0.3
glsl-shader-opts-append=wrr_threshold=0.5
glsl-shader-opts-append=wrr_sat_limit=0.10
## fix back some contrast
glsl-shaders-append="~~/shaders/luma_contrast.glsl"
glsl-shader-opts-append=lcon_black=0.02
glsl-shader-opts-append=lcon_white=0.98
## Soft DNR
glsl-shaders-append="~~/shaders/dnr_residue_clean.glsl"
glsl-shader-opts-append=dr_chroma_sigma=0.015
glsl-shader-opts-append=dr_chroma_str=0.15
glsl-shader-opts-append=dr_luma_str=0.15
glsl-shader-opts-append=dr_temporal_str=0.10
glsl-shader-opts-append=dr_motion_thr=0.020

# Exploits jitter diversity for HF reconstruction
## Alternating frame shift
glsl-shaders-append="~~/shaders/frame_shift.glsl"
glsl-shader-opts-append=fsh_x=0.9
glsl-shader-opts-append=fsh_y=-0.7
glsl-shader-opts-append=fsh_every=2
## Multi-frame subpixel SR
glsl-shaders-append="~~/shaders/sr_temporal_subpixel.glsl"
glsl-shader-opts-append=sr_jitter_x=0.9
glsl-shader-opts-append=sr_jitter_y=-0.7
glsl-shader-opts-append=sr_mix=0.55
glsl-shader-opts-append=sr_motion_thr=0.05

# 4K -> 1080p -> 4K
## Diagonal self-merge
glsl-shaders-append="~~/shaders/diagonal_merge.glsl"
glsl-shader-opts-append=dm_weight=0.80
glsl-shader-opts-append=dm_shift=1.10
## "Aliens" high energy noise
glsl-shaders-append="~~/shaders/chaos_grain.glsl"
glsl-shader-opts-append=cg_strength=0.045
## Remaster: collapse output to 1080p, re-upscale with Lanczos-4 to 4K
## I discard most 1080p sub-pixel information
glsl-shaders-append="~~/shaders/output_remaster.glsl"
glsl-shader-opts-append=rmst_strength=0.5

# Detail improvements
## Finding details (safe)
glsl-shaders-append="~~/shaders-dl/SSimSuperRes_RT.glsl"
## Temporal sharpen
glsl-shaders-append="~~/shaders/temporal_sharpen.glsl"
glsl-shader-opts-append=tsh_strength=0.40
glsl-shader-opts-append=tsh_radius=1.0
## Edge-aware sharpen
glsl-shaders-append="~~/shaders/masked_sharpen.glsl"
glsl-shader-opts-append=msh_strength=0.40
glsl-shader-opts-append=msh_clamp_amt=0.038
glsl-shader-opts-append=msh_edge_low=0.02
glsl-shader-opts-append=msh_edge_high=0.24
glsl-shader-opts-append=msh_flat_protect=0.88
glsl-shader-opts-append=msh_motion_gate=0.65
## Hair-aware adaptive sharpen
glsl-shaders-append="~~/shaders/hair_aware_sharpen.glsl"
## Temporal detail accumulation
glsl-shaders-append="~~/shaders/static_detail_accum.glsl"
glsl-shader-opts-append=sda_alpha=0.30
glsl-shader-opts-append=sda_smooth_str=0.60
glsl-shader-opts-append=sda_detail_gain=0.40
glsl-shader-opts-append=sda_conf_rate=0.20
glsl-shader-opts-append=sda_motion_thr=0.012
glsl-shader-opts-append=sda_luma_lo=0.06
glsl-shader-opts-append=sda_luma_hi=0.75
glsl-shader-opts-append=sda_smooth_thr=0.035
glsl-shader-opts-append=sda_skin_protect=0.70
## Mid-frequency luma contrast
glsl-shaders-append="~~/shaders/luma_clarity.glsl"
glsl-shader-opts-append=lc_strength=0.30
glsl-shader-opts-append=lc_radius=8.0
## Edge AA
glsl-shaders-append="~~/shaders/smaa.glsl"
glsl-shader-opts-append=sma_edge_strength=0.88
glsl-shader-opts-append=sma_corner_strength=0.42
glsl-shader-opts-append=sma_gamma=1.0
## Temporal motion blur
glsl-shaders-append="~~/shaders/temporal_motion_blur.glsl"
glsl-shader-opts-append=tmb_strength=0.3
glsl-shader-opts-append=tmb_motion_lo=0.02
glsl-shader-opts-append=tmb_motion_hi=0.10
glsl-shader-opts-append=tmb_transience_lo=2.0
glsl-shader-opts-append=tmb_transience_hi=6.0
glsl-shader-opts-append=tmb_ema_alpha=0.25  

# Slight detail construction
## Micro-contrast
glsl-shaders-append="~~/shaders/micro_contrast.glsl"
glsl-shader-opts-append=mc_radius=0.5
glsl-shader-opts-append=mc_amount=0.22
glsl-shader-opts-append=mc_threshold=0.02
## Details additions
glsl-shaders-append="~~/shaders-dl/skin_texture_amplifier.glsl"
## Micro Detail Enhancer
glsl-shaders-append="~~/shaders/micro_detail_luma.glsl"
glsl-shader-opts-append=mdl_strength=0.08
glsl-shader-opts-append=mdl_threshold=0.004
## Skin Detail Enhancer
glsl-shaders-append="~~/shaders/skin_detail_luma.glsl"
glsl-shader-opts-append=sdl_strength=0.06
glsl-shader-opts-append=sdl_skin_hue=0.075
glsl-shader-opts-append=sdl_skin_width=0.070
glsl-shader-opts-append=sdl_skin_soft=0.030
glsl-shader-opts-append=sdl_freq=1.25
glsl-shader-opts-append=sdl_anisotropy=0.55 

# Noise and grain
## Bayer RGB dither
glsl-shaders-append="~~/shaders/bayer_dither.glsl"
glsl-shader-opts-append=bd_amplitude=0.15
glsl-shader-opts-append=bd_chroma_offset=1.0
glsl-shader-opts-append=bd_mix=0.3
## Light temporal texture for skin
glsl-shaders-append="~~/shaders/skin_temporal_grain.glsl"
glsl-shader-opts-append=stg_grain=6.0
glsl-shader-opts-append=stg_motion=0.5
glsl-shader-opts-append=stg_skin_boost=1.0

glsl-shaders-append="~~/shaders/cas_pre_save.glsl"
glsl-shaders-append="~~/shaders-dl/AMD_CAS_RT.glsl"
glsl-shaders-append="~~/shaders/cas_luma_blend.glsl"
glsl-shader-opts-append=cas_luma_blend=0.10

## Light temporal texture
glsl-shaders-append="~~/shaders/temporal_luma_grain.glsl"
glsl-shader-opts-append=tlg_grain=8.0
glsl-shader-opts-append=tlg_motion=0.5

# Just in case there is a downscale
glsl-shaders-append="~~/shaders-dl/SSimDownscaler.glsl"