[dvd]
# Applied by scripts/dvd_profile.lua — never auto-triggered
glsl-shaders-clr

# A — Analog Repair
# Deinterlace
deinterlace=auto
# Deterministic OkLab (Björn Ottosson) BT.601/709 → BT.2020 normalizer
glsl-shaders-append="~~/shaders/autocolormatrix.glsl"
# White restoration — recovers chroma flattened by MPEG-2 chroma quantization in highlights
glsl-shaders-append="~~/shaders/white_restore_rgb.glsl"
glsl-shader-opts-append=wrr_strength=0.3
glsl-shader-opts-append=wrr_threshold=0.5
glsl-shader-opts-append=wrr_sat_limit=0.10
# HDR-safe OkLCH vibrance
glsl-shaders-append="~~/shaders/oklch_vibrance.glsl"
glsl-shader-opts-append=ov_vibrance=0.10
glsl-shader-opts-append=ov_skin_protect=0.45
glsl-shader-opts-append=ov_skin_hue=0.07
glsl-shader-opts-append=ov_skin_width=0.08
glsl-shader-opts-append=ov_mid_bias=0.42
glsl-shader-opts-append=ov_gamma_in=1.0
glsl-shader-opts-append=ov_gamma_out=1.0
glsl-shader-opts-append=ov_chroma_tame=0.10
# Structural Cleaning Reinforcement Pass
glsl-shaders-append="~~/shaders/analog_structure_cleaner.glsl"
glsl-shader-opts-append=asc_sigma=0.2
glsl-shader-opts-append=asc_m_lo=0.02
glsl-shader-opts-append=asc_m_hi=0.20
glsl-shader-opts-append=asc_r_low=0.15
glsl-shader-opts-append=asc_r_high=0.45
glsl-shader-opts-append=asc_clean=0.3
glsl-shader-opts-append=asc_sharpen=0.3
glsl-shader-opts-append=asc_edge_lo=0.01
glsl-shader-opts-append=asc_edge_hi=0.08
# Edge Stabilization & Perceptual Phase Re-Alignment v2 (deterministic, perceptually tunable)
glsl-shaders-append="~~/shaders/edge_phase_realign_v2.glsl"
glsl-shader-opts-append=eprv_strength=0.6
glsl-shader-opts-append=eprv_edge_gain=4.0
glsl-shader-opts-append=eprv_edge_exp=3.0
glsl-shader-opts-append=eprv_phase_max=0.8
glsl-shader-opts-append=eprv_amp_norm=0.5
glsl-shader-opts-append=eprv_tangential_smooth=0.5
glsl-shader-opts-append=eprv_temporal_alpha=0.3
glsl-shader-opts-append=eprv_global_gain=3.0
glsl-shader-opts-append=eprv_skin_protect=0.0

# A not very fancy hdeband for hi8 8x8 macro blocks
glsl-shaders-append="~~/shaders/hi8_deblock.glsl"
glsl-shader-opts-append=hd_strength=0.40
glsl-shader-opts-append=hd_var_low=0.0003
glsl-shader-opts-append=hd_var_high=0.004
glsl-shader-opts-append=hd_edge_thresh=0.05
glsl-shader-opts-append=hd_debug_mask=0.0
# Mild Clean+BlockFix (edge-aware denoise + flat deblock + dering + stochastic gating)
glsl-shaders-append="~~/shaders/mild_clean_blockfix.glsl"
glsl-shader-opts-append=mcb_clean_strength=0.8

# DVD MPEG-2 DCT block deblock — at native LUMA/CHROMA resolution, before upscaling
glsl-shaders-append="~~/shaders/dvd_luma_deblock.glsl"
glsl-shader-opts-append=dcld_strength=0.50
glsl-shader-opts-append=dcld_threshold=0.06
glsl-shaders-append="~~/shaders/dvd_chroma_deblock.glsl"
glsl-shader-opts-append=dccd_strength=0.60
glsl-shader-opts-append=dccd_threshold=0.08
glsl-shader-opts-append=dccd_luma_gate=0.04

# Weird geomatrical shapes attenuation
glsl-shaders-append="~~/shaders/fake_micro_texture_removal.glsl"
glsl-shader-opts-append=fmtr_clean=0.20

# Softening
#glsl-shaders-append="~~/shaders/nlmeans_parameter.glsl"
glsl-shader-opts-append=nl_strength=0.15
# Deband
glsl-shaders-append="~~/shaders-dl/hdeband.glsl"

# Add some texturing to uniform colors - anti plastic
glsl-shaders-append="~~/shaders/texture_classify.glsl"
glsl-shader-opts-append=tc_strength=0.4

glsl-shaders-append="~~/shaders-dl/CfL_Prediction_RT.glsl"
glsl-shaders-append="~~/shaders-dl/KrigBilateral.glsl"
glsl-shaders-append="~~/shaders-dl/ravu-r4.hook"
glsl-shaders-append="~~/shaders-dl/SSimSuperRes_RT.glsl"

glsl-shaders-append="~~/shaders/dnr_residue_clean.glsl"
glsl-shader-opts-append=dr_chroma_sigma=0.030
glsl-shader-opts-append=dr_chroma_str=0.90
glsl-shader-opts-append=dr_luma_str=0.65
glsl-shader-opts-append=dr_temporal_str=0.10
glsl-shader-opts-append=dr_motion_thr=0.020

#glsl-shaders-append="~~/shaders-dl/FSR.glsl"

# Calming the upscaling
# Anti-ringing mop-up
glsl-shaders-append="~~/shaders/ringing_guard.glsl"
glsl-shader-opts-append=rg_strength=0.80
glsl-shader-opts-append=rg_radius=1.5
glsl-shader-opts-append=rg_gamma_in=1.0
glsl-shader-opts-append=rg_gamma_out=1.0
glsl-shader-opts-append=rg_lobe_strength=0.65
glsl-shader-opts-append=rg_lobe_threshold=0.015
glsl-shader-opts-append=rg_lobe_priority=0.65
glsl-shader-opts-append=rg_delta_cap=0.50
glsl-shader-opts-append=rg_apply_threshold=0.02
# Smoothing border
glsl-shaders-append="~~/shaders/micro_diffusion.glsl"
glsl-shader-opts-append=md_strength=0.8
glsl-shader-opts-append=md_low=0.001
glsl-shader-opts-append=md_high=0.04
glsl-shader-opts-append=md_radius=1.2

# Temporal stabilization and motion blur
glsl-shaders-append="~~/shaders/temporal_stabilizer.glsl"

# Quality improvements
## Temporal sharpen (TXAA-lite; keep modest)
glsl-shaders-append="~~/shaders/temporal_sharpen.glsl"
glsl-shader-opts-append=tsh_strength=0.25
glsl-shader-opts-append=tsh_radius=1.0
## Hair-aware sharpen (detail recovery)
glsl-shaders-append="~~/shaders/hair_aware_sharpen.glsl"
glsl-shader-opts-append=has_sharp_amt=0.64
glsl-shader-opts-append=has_hf_gain=1.25
glsl-shader-opts-append=has_flat_guard=0.92
glsl-shader-opts-append=has_temp_sense=0.68
glsl-shader-opts-append=has_clamp_amt=0.026
## Edge-aware sharpen (reined in but still strong)
glsl-shaders-append="~~/shaders/masked_sharpen.glsl"
glsl-shader-opts-append=msh_strength=0.50
glsl-shader-opts-append=msh_clamp_amt=0.038
glsl-shader-opts-append=msh_edge_low=0.02
glsl-shader-opts-append=msh_edge_high=0.24
glsl-shader-opts-append=msh_flat_protect=0.88
glsl-shader-opts-append=msh_motion_gate=0.65
## Edge AA (stabilizes FSR/SSim ringing in motion)
glsl-shaders-append="~~/shaders/smaa.glsl"
glsl-shader-opts-append=sma_edge_strength=0.78
glsl-shader-opts-append=sma_corner_strength=0.22
glsl-shader-opts-append=sma_gamma=1.0
## Static-zone temporal accumulation — kills noise on still mid-tone smooth surfaces
glsl-shaders-append="~~/shaders/static_smooth.glsl"
glsl-shader-opts-append=ss_alpha=0.55
glsl-shader-opts-append=ss_strength=0.60
glsl-shader-opts-append=ss_motion_thr=0.012
glsl-shader-opts-append=ss_luma_lo=0.06
glsl-shader-opts-append=ss_luma_hi=0.55
glsl-shader-opts-append=ss_smooth_thr=0.035
glsl-shader-opts-append=ss_skin_protect=0.80
## Mid-frequency luma contrast
glsl-shaders-append="~~/shaders/luma_clarity.glsl"
glsl-shader-opts-append=lc_strength=0.25
glsl-shader-opts-append=lc_radius=8.0
## Temporal motion blur
glsl-shaders-append="~~/shaders/temporal_motion_blur.glsl"
glsl-shader-opts-append=tmb_strength=0.4
glsl-shader-opts-append=tmb_motion_lo=0.02
glsl-shader-opts-append=tmb_motion_hi=0.10
glsl-shader-opts-append=tmb_transience_lo=2.0
glsl-shader-opts-append=tmb_transience_hi=6.0
glsl-shader-opts-append=tmb_ema_alpha=0.25

# Texture and grain
## Micro-contrast
glsl-shaders-append="~~/shaders/micro_contrast.glsl"
glsl-shader-opts-append=mc_radius=0.8
glsl-shader-opts-append=mc_amount=0.22
glsl-shader-opts-append=mc_threshold=0.02
## Details additions
#glsl-shaders-append="~~/shaders-dl/skin_texture_amplifier.glsl"
## Micro Detail Enhancer (Luma-only, edge-gated)
glsl-shaders-append="~~/shaders/micro_detail_luma.glsl"
glsl-shader-opts-append=mdl_strength=0.28
glsl-shader-opts-append=mdl_threshold=0.004
## Skin Detail Enhancer (skin-gated luma microtexture, grain-free output)
glsl-shaders-append="~~/shaders/skin_detail_luma.glsl"
glsl-shader-opts-append=sdl_strength=0.30
glsl-shader-opts-append=sdl_skin_hue=0.075
glsl-shader-opts-append=sdl_skin_width=0.070
glsl-shader-opts-append=sdl_skin_soft=0.030
glsl-shader-opts-append=sdl_freq=1.25
glsl-shader-opts-append=sdl_anisotropy=0.55 

# Analog feel
## Smoothing of pixel for analog feel
#glsl-shaders-append="~~/shaders/gaussian_blur.glsl"
glsl-shader-opts-append=gb_sigma=0.01
## The pain - Thanks to Mattias Gustavsson for his amazing CRT shader
glsl-shaders-append="~~/shaders/crt-mattias.glsl"
glsl-shader-opts-append=cm_bloom_spread=1.2
glsl-shader-opts-append=cm_barrel=0.04
glsl-shader-opts-append=cm_chroma=0.25
glsl-shader-opts-append=cm_halation=0.04
glsl-shader-opts-append=cm_contrast=0.02
glsl-shader-opts-append=cm_vignette=0.18
glsl-shader-opts-append=cm_noise=0.020
glsl-shader-opts-append=cm_black_lift=0.00
glsl-shader-opts-append=cm_brightness=1.0

glsl-shaders-append="~~/shaders-dl/LumaSharpen.glsl"
glsl-shaders-append="~~/shaders-dl/AMD_CAS_RT.glsl"

## Grain
## Bayer RGB dither
glsl-shaders-append="~~/shaders/bayer_dither.glsl"
glsl-shader-opts-append=bd_amplitude=0.32
glsl-shader-opts-append=bd_chroma_offset=2.0
glsl-shader-opts-append=bd_mix=0.4
## Light temporal texture for skin
glsl-shaders-append="~~/shaders/skin_temporal_grain.glsl"
glsl-shader-opts-append=stg_grain=7.0
glsl-shader-opts-append=stg_motion=0.5
glsl-shader-opts-append=stg_skin_boost=1.0
## Light temporal texture
glsl-shaders-append="~~/shaders/temporal_luma_grain.glsl"
glsl-shader-opts-append=tlg_grain=7.0
glsl-shader-opts-append=tlg_motion=0.5
## "Aliens" movie juice juice (temporally-incoherent white noise).
glsl-shaders-append="~~/shaders/chaos_grain.glsl"
glsl-shader-opts-append=cg_strength=0.05

# Analog look
## fix back some contrast
glsl-shaders-append="~~/shaders/luma_contrast.glsl"
glsl-shader-opts-append=lcon_black=0.01
glsl-shader-opts-append=lcon_white=0.97
## CRT scanline
glsl-shaders-append="~~/shaders/crt_scanline_black.glsl"
glsl-shader-opts-append=sl2_period=2.0
glsl-shader-opts-append=sl2_strength=0.1
glsl-shader-opts-append=sl2_dark=0.60
glsl-shader-opts-append=sl2_mid=0.40
glsl-shader-opts-append=sl2_bright=0.15

# Just in case there is a downscale
glsl-shaders-append="~~/shaders-dl/SSimDownscaler.glsl"